name: Overpass probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe Overpass mirrors
        run: |
          mkdir -p out; cd out
          Q='[out:json][timeout:25];(way["building"](36.3933,-97.8813,36.3979,-97.8755););out body;>;out skel qt;'
          probe() { # name url extra-curl-args...
            n=$1; u=$2; shift 2
            s=$(date +%s.%N)
            code=$(curl -sS -m 40 -o body.txt -w '%{http_code}' "$@" "$u" 2>err.txt || true)
            e=$(date +%s.%N)
            printf '\n=== %s  HTTP %s  %.1fs\n' "$n" "$code" "$(echo "$e - $s" | bc)" >> report.txt
            head -c 400 body.txt >> report.txt; head -c 200 err.txt >> report.txt
          }
          UA='Paperball/1.0 (+https://paintball-v2.netlify.app)'
          for m in https://overpass-api.de/api/interpreter https://lz4.overpass-api.de/api/interpreter https://z.overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.osm.jp/api/interpreter; do
            probe "POST form UA $m" "$m" -A "$UA" --data-urlencode "data=$Q"
          done
          M=https://overpass-api.de/api/interpreter
          probe "POST form NO-UA" "$M" -A "" --data-urlencode "data=$Q"
          probe "POST form browser-UA" "$M" -A "Mozilla/5.0 (Linux; Android 14) Chrome/129 Mobile" --data-urlencode "data=$Q"
          probe "POST form UA+Accept json" "$M" -A "$UA" -H "Accept: application/json" --data-urlencode "data=$Q"
          probe "POST form UA+Referer+Origin" "$M" -A "$UA" -H "Origin: https://paintball-v2.netlify.app" -H "Referer: https://paintball-v2.netlify.app/" --data-urlencode "data=$Q"
          probe "GET UA" "$M?data=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1]))" "$Q")" -A "$UA"
          probe "POST raw body UA" "$M" -A "$UA" -H "Content-Type: text/plain" --data-binary "$Q"
          probe "status page" "https://overpass-api.de/api/status" -A "$UA"
          cat report.txt
      - name: Publish
        if: always()
        run: |
          cd out; git init -q -b probe-results; git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -qm probe; git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" probe-results
