name: Refresh preloaded map
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'   # weekly, Monday 09:17 UTC
  push:
    branches: [main]
    paths:
      - 'js/config.js'
      - 'scripts/preload.mjs'
      - '.github/workflows/preload.yml'
permissions:
  contents: write
jobs:
  preload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/preload.mjs
      - name: Commit if changed (push triggers a Netlify deploy)
        run: |
          test -f data/preload_osm.json || { echo "no preload produced"; exit 0; }
          git config user.name "preload-bot"
          git config user.email "preload-bot@users.noreply.github.com"
          git add data/preload_osm.json
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -qm "Refresh preloaded default map [skip smoke]"
          git push
