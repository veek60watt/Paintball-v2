name: Refresh preloaded map
on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'   # weekly, Monday 09:17 UTC
  push:
    branches: [main]
    paths:
      - 'js/config.js'
      - 'scripts/preload.mjs'
      - '.github/workflows/preload.yml'
permissions:
  contents: write
jobs:
  preload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/preload.mjs 2>&1 | tee preload.log
      - name: Commit if changed (push triggers a Netlify deploy)
        run: |
          test -f data/preload_osm.json || { echo "no preload produced"; exit 0; }
          git config user.name "preload-bot"
          git config user.email "preload-bot@users.noreply.github.com"
          git add data/preload_osm.json
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -qm "Refresh preloaded default map [skip smoke]"
          git push
      - name: Publish log to preload-log branch
        if: always()
        run: |
          mkdir -p /tmp/log && cp preload.log /tmp/log/ 2>/dev/null || echo "no log" > /tmp/log/preload.log
          ls -la data/ >> /tmp/log/preload.log; cd /tmp/log
          git init -q -b preload-log; git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -A; git commit -qm "preload log ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" preload-log
